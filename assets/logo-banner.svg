<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" role="img" aria-label="NetForge — IPAM, topologie et inventaire réseau">
  <title>NetForge — IPAM, topologie et inventaire réseau</title>
  <defs>
    <style>
      /* Archivo is the app's display face; it won't be available to a README
         renderer, so the wordmark leans on uppercase plus positive tracking
         instead of the typeface itself. That reads as front-panel silkscreen
         even after the font substitutes, which a specific face would not.

         The colour-scheme query lets the wordmark survive GitHub's dark theme —
         the mark itself needs no help, it carries its own plate. */
      .wordmark {
        font: 700 44px Archivo, "Archivo Variable", "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: 1.6px;
        fill: #161918;
      }
      .tagline {
        font: 500 13px "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: #565C58;
      }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #E6E9E5; }
        .tagline  { fill: #98A09C; }
      }
    </style>
  </defs>

  <!-- Mark, scaled to 96 px. Geometry identical to assets/logo.svg +
       frontend/public/favicon.svg so the banner, the browser tab and the app
       all read as the same icon. -->
  <g transform="translate(16, 16) scale(1.5)">
    <path d="M0 0 H50 L64 14 V64 H0 Z" fill="#141716"/>
    <g fill="#E9ECE6" fill-opacity="0.12">
      <rect x="33" y="23" width="8" height="8"/>
      <rect x="43" y="23" width="8" height="8"/>
      <rect x="23" y="33" width="8" height="8"/>
      <rect x="33" y="33" width="8" height="8"/>
      <rect x="43" y="33" width="8" height="8"/>
      <rect x="13" y="43" width="8" height="8"/>
      <rect x="23" y="43" width="8" height="8"/>
      <rect x="33" y="43" width="8" height="8"/>
      <rect x="43" y="43" width="8" height="8"/>
    </g>
    <g fill="#2FADA6">
      <rect x="13" y="13" width="8" height="8"/>
      <rect x="23" y="13" width="8" height="8"/>
      <rect x="33" y="13" width="8" height="8"/>
      <rect x="43" y="13" width="8" height="8"/>
      <rect x="13" y="23" width="8" height="8"/>
      <rect x="23" y="23" width="8" height="8"/>
      <rect x="13" y="33" width="8" height="8"/>
    </g>
  </g>

  <text x="132" y="64" class="wordmark">NETFORGE</text>
  <text x="134" y="92" class="tagline">IPAM, topologie et inventaire réseau</text>
</svg>
