<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" role="img" aria-label="NetForge">
  <title>NetForge — IPAM, topology, infrastructure</title>
  <defs>
    <style>
      .wordmark { font: 700 56px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -2.2px; }
      .tagline  { font: 500 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Mark, scaled to 96 px, geometry identical to assets/logo.svg + favicon -->
  <g transform="translate(12, 22) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#0e7490"/>
    <path d="M 19 47 L 19 17 L 45 47 L 45 17"
          stroke="#ffffff" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="45" cy="17" r="3.6" fill="#22d3ee"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="130" y="84"  class="wordmark" fill="#0e7490">NetForge</text>
  <text x="132" y="112" class="tagline"  fill="#64748b">IPAM · TOPOLOGY · INFRASTRUCTURE</text>
</svg>
