<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" role="img" aria-label="NetForge — IPAM, topology, infrastructure">
  <title>NetForge — IPAM, topology, infrastructure</title>
  <defs>
    <style>
      .wordmark { font: 600 54px Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1.6px; }
      .tagline  { font: 500 13px Inter, "Inter Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Mark, scaled to 96 px. Geometry identical to assets/logo.svg + favicon
       so the banner, the browser tab and the app all read as the same icon. -->
  <g transform="translate(16, 16) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#4F46E5"/>
    <path d="M 21 43 L 32 32 L 43 21"
          stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="21" cy="43" r="5" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="32" cy="32" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="43" cy="21" r="5.5" fill="#FFFFFF"/>
  </g>

  <text x="128" y="66" class="wordmark" fill="#18181B">NetForge</text>
  <text x="130" y="92" class="tagline"  fill="#62626C">IPAM, topologie et inventaire réseau</text>
</svg>
