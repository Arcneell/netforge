<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NetForge logo">
  <title>NetForge</title>
  <!-- Mini-topology mark: a literal representation of what NetForge draws
       in the Topology view. Three nodes on a diagonal, two connectors,
       and a luminance gradient (dim → bright) that gives the mark depth
       and direction. No skeuomorphic ornament, no gradient fills. -->

  <!-- Backdrop — deep cyan-950 so the bright endpoint reads as a spotlight -->
  <rect width="64" height="64" rx="14" fill="#083344"/>

  <!-- Connectors drawn first so the nodes layer on top -->
  <path d="M 20 44 L 32 32 L 44 20"
        stroke="#0891b2"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Nodes: anchor (dim teal) → relay (cyan-400) → endpoint (white) -->
  <circle cx="20" cy="44" r="5.5" fill="#0e7490"/>
  <circle cx="32" cy="32" r="5.5" fill="#22d3ee"/>
  <circle cx="44" cy="20" r="6"   fill="#ffffff"/>
</svg>
