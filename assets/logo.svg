<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NetForge logo">
  <title>NetForge</title>
  <!-- Modern monochrome duotone mark: deep cyan square + confident "N" +
       one bright accent at the top-right endpoint. The accent reads as a
       network node / forge spark and prevents the silhouette from looking
       like a generic letterform tile. -->
  <rect width="64" height="64" rx="14" fill="#0e7490"/>
  <path d="M 19 47 L 19 17 L 45 47 L 45 17"
        stroke="#ffffff"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>
  <circle cx="45" cy="17" r="3.6" fill="#22d3ee"/>
</svg>
