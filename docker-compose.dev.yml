# docker-compose.dev.yml — full local stack for development.
#
# Start everything (postgres + backend + frontend):
#   docker compose -f docker-compose.dev.yml up -d
#
# Apply migrations + smoke-test:
#   docker compose -f docker-compose.dev.yml exec backend alembic upgrade head
#   curl http://localhost:8000/api/health
#
# Endpoints:
#   - SPA (Vite, HMR enabled):  http://localhost:5173
#   - Backend OpenAPI:           http://localhost:8000/api/docs
#   - Postgres:                  localhost:5432 (psql from host)
#
# Differences vs production:
#   - frontend runs Vite dev server (not nginx + built bundle)
#   - backend started with --reload and the source mounted as a volume
#   - postgres port exposed on localhost
#   - no TLS, no nginx reverse proxy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netforge}
      POSTGRES_USER: ${POSTGRES_USER:-netforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      # Bind to loopback only — the dev defaults (POSTGRES_PASSWORD=dev)
      # are weak by design and must never be reachable from the LAN.
      # Host port is overridable: a Postgres already installed on the host
      # owns 5432 and the bind would fail. Set POSTGRES_HOST_PORT=5433 in .env.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netforge}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-netforge}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-dev-signing-key-not-for-prod}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      # Default to the "dev" auth provider for local stacks: no real IdP,
      # /api/auth/login signs you straight in as DEV_ADMIN_EMAIL (admin role).
      # Switch to github / oidc in .env once you want to test the real flow.
      AUTH_PROVIDER: ${AUTH_PROVIDER:-dev}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@example.com}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-Dev Admin}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid email profile}
      # ---- Sessions / rate limiting ----
      # Same defaults as the backend's own, but forwarded so a local .env can
      # actually shorten sessions or tighten limits while testing.
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      RATE_LIMIT_WRITES_PER_WINDOW: ${RATE_LIMIT_WRITES_PER_WINDOW:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      # "database" shares the counters across workers/replicas via the
      # rate_limit_counters table; "memory" is the legacy per-process window.
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-database}
      # PUBLIC_URL drives OAuth/OIDC redirect URIs. When the SPA proxies /api/*,
      # the browser-visible host is the Vite dev server (5173), so callbacks
      # must come back through there to land on the SPA after auth.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # AI integration — provider-agnostic, off by default. Flip AI_ENABLED
      # in .env + drop in the matching API key, then `docker compose restart
      # backend` for the change to take effect.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_RATE_LIMIT_CALLS: ${AI_RATE_LIMIT_CALLS:-20}
      AI_RATE_WINDOW_SECONDS: ${AI_RATE_WINDOW_SECONDS:-3600}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      # Granular AI toggles — see the note in docker-compose.yml: these have to
      # be listed explicitly or a .env opt-out never reaches the backend.
      AI_DRAFTS_ENABLED: ${AI_DRAFTS_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-true}
    ports:
      # Bind to loopback only. The default AUTH_PROVIDER=dev signs anyone
      # hitting /api/auth/login in as admin, no credentials needed — a
      # 0.0.0.0 bind would auto-grant admin to anyone on the LAN that
      # can reach port 8000. The provider also refuses to start with a
      # non-loopback PUBLIC_URL as a belt-and-suspenders guard.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    # Node 22 = active LTS, same major as the CI matrix and the production
    # build stage (frontend/Dockerfile) — Node 20 hit EOL April 2026.
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      # Inside the docker network, the backend is reachable by service name.
      # `vite.config.ts` reads VITE_BACKEND_URL to wire the /api proxy.
      VITE_BACKEND_URL: http://backend:8000
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-dev}
      # Polling-based file watcher — Docker Desktop on Windows / WSL doesn't
      # propagate inotify events into the container, so HMR needs this to fire.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      # Loopback-only — the dev SPA proxies /api/* to the backend, and
      # the backend in turn signs anyone in as admin via AUTH_PROVIDER=dev.
      # Exposing 5173 on the LAN means LAN-reachable admin in one click.
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume masks the host's node_modules — keeps native deps Linux-built
      # inside the container even when the bind-mounted host directory is Windows.
      - frontend_node_modules:/app/node_modules
    # `npm install` is fast after the first run because the named volume persists
    # the install across `compose down`. `--host` is required to expose Vite on 0.0.0.0.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata_dev:
  frontend_node_modules:
