[project]
name = "netforge-backend"
version = "0.1.0"
description = "Netforge — IPAM & infra management API"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # >=1.6.4 pulls the JWS/JWT fixes from the 1.6 series.
    "authlib>=1.6.4",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    # Optional at *runtime* (REDIS_URL empty disables every consumer — see
    # app/cache.py) but a hard install dependency so the image ships one
    # artefact regardless of whether an operator turns the cache on. Pure
    # Python, no native deps; ~1 MB installed.
    "redis>=5.2",
    # AI integration — three providers, all optional at runtime. The factory
    # only imports the one matching AI_PROVIDER so a deployment can leave the
    # unused SDKs uninstalled if it really wants to slim the image.
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.7",
    # PDF export of the advisor report. fpdf2 is pure-Python, no native deps,
    # which keeps the backend Dockerfile slim — WeasyPrint would pull libcairo,
    # libpango and friends for a single endpoint that ships once a month.
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    # tests/test_compose_env_passthrough.py parses the compose files. Present
    # transitively via uvicorn[standard], declared here so the guard does not
    # break if that transitive dep ever goes away.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",   # line length — handled by ruff format
    # `Depends(...)`, `Query(...)`, `File(...)`, `Header(...)` in default
    # arguments is the canonical FastAPI dependency-injection pattern; the
    # B008 warning is a known false positive for this framework.
    "B008",
    # Migrations and a few routers intentionally import after a guard / logger
    # setup; the constraint that imports live at top-of-file is not worth
    # fighting in those generated / boilerplate files.
    "E402",
    # Single-letter capitalised locals named for SQLAlchemy aliases ("Switch_a",
    # "Port_b") read better with the model casing — disable the N806 nag in
    # the topology helpers where this pattern is intentional.
    "N806",
    # NetForge raises `AIRateLimitExceeded` / `AIUnsupportedFeatureError`; the
    # "Error suffix" convention is fine for new ones but renaming the legacy
    # `*Exceeded` would break public imports for no real upside.
    "N818",
    # The codebase's enums explicitly inherit `(str, Enum)` rather than the
    # 3.11+ `StrEnum` because StrEnum's `__str__` returns the value not the
    # member name, which subtly breaks a few of the existing equality checks.
    # Forcing a flip is a separate refactor — keep the rule off for now.
    "UP042",
    "UP046",
    # Em-dashes and curly quotes are used intentionally in docstrings and
    # prose-style comments. The ambiguous-unicode warnings are only useful
    # inside string literals that look like code, which is not the case here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402", "F401", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --cov is intentionally NOT in addopts: it slows down the local dev loop
# (`pytest -k foo`, `pytest tests/test_x.py`) for no benefit outside CI.
# CI invokes it explicitly with --cov=app --cov-fail-under=N (see
# .github/workflows/ci.yml).
[tool.coverage.run]
omit = [
    "*/alembic/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Pragmatic baseline, not a strict-mode gate: third-party stubs are
# inconsistent (authlib ships none) and the codebase leans on SQLAlchemy's
# Mapped[]/Select[] generics + Sequence-vs-list variance in a few spots that
# mypy flags but aren't real bugs. Tightening these is a separate, deliberate
# effort — this section exists so `mypy app` is runnable and reproducible in
# CI, not to make it clean today.
ignore_missing_imports = true
warn_unused_ignores = false

