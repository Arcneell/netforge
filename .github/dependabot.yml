# Dependabot config — keeps the toolchain + image base layers + workflow
# action SHAs current. Six ecosystems track separately so a Python
# bump doesn't show up in a "frontend dependencies" PR.
#
# release.yml pins third-party actions to full commit SHAs (defence
# against "tag move" attacks on a workflow with `packages: write`).
# Dependabot's `github-actions` ecosystem will open PRs that update both
# the SHA and the trailing `# vX` comment in lockstep, so the pinned
# workflow stays current without manual SHA bookkeeping.
#
# ci.yml uses floating tags (`@v7`/...) on purpose: that workflow
# is read-only (`contents: read` only) so a compromised action could not
# pivot to publish anything; the ergonomic win of automatic updates
# outweighs the SHA-pinning complexity there. Dependabot still files
# major-version bumps via this same config (it updates by tag if the
# workflow uses tags).
#
# Runtime and service majors are ignored below. Why, in one sentence: each of
# them is pinned in more places than Dependabot can see, so a bump it opens is
# always a partial one.
#
#   node 22    frontend/Dockerfile, docker-compose.dev.yml  ← Dependabot sees
#              ci.yml x3 (`node-version: "22"`)              ← it does not
#   python 3.12  backend/Dockerfile                          ← sees
#              ci.yml x4, pyproject `requires-python`        ← does not
#   postgres 16  docker-compose.yml, docker-compose.dev.yml  ← sees
#              ci.yml x2 (integration + e2e services)        ← does not
#   redis 8      docker-compose.yml, docker-compose.dev.yml  ← sees
#              ci.yml x1 (integration service)               ← does not
#
# PR #155 was exactly this: it moved docker-compose.dev.yml to node:26 and left
# the other four pins on 22, against the comment in that very file requiring
# they match. PR #156 moved both compose files to postgres:18 while CI kept
# proving the SQL on 16 — and 18 cannot even start on a 16 data directory.
#
# Ignoring them does not mean never upgrading. It means the upgrade is a
# deliberate PR that moves every pin at once (and, for postgres, documents the
# pg_upgrade path in docs/07-deployment.md). Delete the matching `ignore` entry
# when you do that work. Patch-level fixes still arrive without a PR, because
# every one of these pins is an imprecise tag that re-resolves on rebuild.
#
# Known-good next targets at the time of writing (2026-07-30): node 24 is the
# Active LTS (22 went to maintenance 2025-10-21, EOL 2027-04-30); 26 does not
# become LTS until 2026-10-28, so it is the wrong target despite being newest.

version: 2

updates:
  # ---------------- GitHub Actions ----------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
      - github_actions

  # ---------------- Python (backend) ----------------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(backend)
    labels:
      - dependencies
      - python
    # Group runtime + dev-tool minor/patch bumps into one PR per week so
    # the queue stays manageable. Majors still open individual PRs so
    # they're reviewed in isolation.
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # `pydantic-core` cannot move on its own, ever. `pydantic` pins it to an
      # exact version, so the only thing that bumps it is a pydantic release —
      # and when one lands, pip-compile picks the matching core automatically.
      #
      # It is a transitive dependency: it appears in requirements.lock.txt but
      # not in pyproject.toml, which is why Dependabot sees it as bumpable at all.
      # #158, #179 and #194 all proposed 2.46.4 -> 2.47.0; all three produced a
      # lockfile pip then refused, and the audit job's drift check caught each one.
      #
      # Not restricted to majors: the proposal that keeps returning is a *minor*.
      # Lift this if pydantic ever stops pinning core exactly.
      - dependency-name: pydantic-core

  # ---------------- Node.js (frontend) ----------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(frontend)
    labels:
      - dependencies
      - javascript
    # Group order matters: a dependency lands in the FIRST group it matches, so
    # the coupled-major groups have to precede the catch-all below. A minor bump
    # to vite does not match `vite-toolchain` (wrong update-type) and still falls
    # through to `frontend-minor-patch`.
    groups:
      # vite cannot move majors alone. #142 (vite 6 -> 8) failed because vitest
      # 2 is built against vite 5/6, and `vitest` pins `@vitest/coverage-v8` to
      # its own exact version — so the three have to arrive together or the PR
      # is dead on opening. Grouping them turns an unmergeable one-liner into a
      # PR that can actually be evaluated.
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
        update-types:
          - major
      # Same shape for the type-checking toolchain. #143 (typescript 5.6 -> 6)
      # needed vue-tsc 3 (2.x supports TS 5 only) and was ultimately blocked by
      # `openapi-typescript`, whose latest release still declares
      # `typescript@^5.x` — `npm ci` refuses the tree with ERESOLVE. Keeping all
      # three in one group means the PR only appears once it can resolve.
      typescript-toolchain:
        patterns:
          - typescript
          - vue-tsc
          - openapi-typescript
        update-types:
          - major
      # eslint majors need the vue plugin in the same PR. #177 (eslint 9 -> 10)
      # installed fine and then crashed at lint time inside
      # eslint-plugin-vue@9's `no-async-in-computed-properties`, because 9.x
      # declares `peer eslint@"... || ^9.0.0"` and stops there. 10.10.0 supports
      # `^10.0.0`, so the pair works — but only as a pair.
      eslint-toolchain:
        patterns:
          - eslint
          - eslint-plugin-vue
          - '@vue/eslint-config-*'
          - typescript-eslint
          - '@typescript-eslint/*'
        update-types:
          - major
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are unreachable, and it is not our tree's fault. Two
      # packages cap it, both on their own latest release:
      #
      #   openapi-typescript@7.13.0   peer typescript: ^5.x
      #   typescript-eslint@latest    peer typescript: >=4.8.4 <6.1.0
      #
      # `npm install` downgrades that to a warning; `npm ci` — what CI runs —
      # refuses the tree with ERESOLVE. Confirmed by installing typescript@7.0.2
      # and running it, on #143 (TS 6), #175 and #187 (TS 7). TS 6 came and went
      # in the meantime without the ecosystem moving.
      #
      # The `typescript-toolchain` group above deliberately stays: when this
      # ignore is lifted, all three packages have to arrive in one PR. Lift it as
      # soon as `openapi-typescript` ships a release whose peer accepts the
      # target major — and expect to drop `baseUrl` from tsconfig.json in the
      # same change, since TS 6 turned its deprecation into an error (TS5101)
      # and 7 removes it. `paths` has resolved relative to the tsconfig since
      # TS 4.1, so prefixing the entries with `./` is the whole fix.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # `@types/node` is a Node version pin wearing a different hat: it declares
      # the API surface the compiler believes exists. Bumping it to 26 while
      # ci.yml, frontend/Dockerfile and the dev compose image all run Node 22
      # means TypeScript accepts calls that are not there at runtime — a
      # divergence the compiler cannot warn about, because the types are the
      # thing that would have warned.
      #
      # It therefore moves with the Node major, in the same deliberate PR. #178
      # proposed 22 -> 26 on its own; `test_runtime_version_pins.py` now checks
      # this pin alongside the other four.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  # ---------------- Docker (backend image base layer) ----------------
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(docker-backend)
    labels:
      - dependencies
      - docker
    ignore:
      # `python:3.12-slim` also lives as `python-version: "3.12"` in four ci.yml
      # jobs and as `requires-python = ">=3.12"` in pyproject.toml, neither of
      # which Dependabot updates. Note this needs `semver-minor` as well as
      # `semver-major`: CPython's 3.12 -> 3.13 reads as a minor bump, and it is
      # the one that would actually land. See the header for the policy.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # ---------------- Docker (frontend image base layer) ----------------
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(docker-frontend)
    labels:
      - dependencies
      - docker
    ignore:
      # The `node:22-alpine` build stage has to stay on the same major as the
      # three `node-version: "22"` entries in ci.yml and the dev compose image.
      # `nginxinc/nginx-unprivileged` in the runtime stage is deliberately NOT
      # ignored — it is pinned in this file only, so a bump there is complete on
      # its own.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # ---------------- Docker Compose (root stack images) ----------------
  # The two `docker` ecosystems above only see Dockerfiles. Images pulled
  # directly by docker-compose.yml / docker-compose.dev.yml at the repo
  # root (postgres:16-alpine, the node dev-frontend image) were covered by
  # nothing and had never been bumped — this ecosystem tracks them.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps(compose)
    labels:
      - dependencies
      - docker
    ignore:
      # A postgres major is a data-directory migration, not an image bump: 18
      # refuses to start on a directory initialised by 16, and both compose
      # files mount a persistent volume. It also needs ci.yml's two
      # `postgres:16-alpine` service containers moved in the same change, or
      # production runs a version the SQL was never tested against.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      # Same coordination problem as frontend/Dockerfile — see the header.
      - dependency-name: node
        update-types:
          - version-update:semver-major
      # `redis` was left out of this list when it was written, on the claim that
      # it "is pinned here only". That was wrong: ci.yml also runs a
      # `redis:N-alpine` service container for the integration job, added in the
      # same PR that introduced the cache. PR #173 then did exactly what the rest
      # of this list exists to prevent — moved both compose files to 8-alpine and
      # left CI proving the Lua rate-limit script against 7.
      #
      # A redis major is otherwise low-risk (it holds only caches and carries its
      # own AOF/RDB forward), so the reason it is here is the coordination, not
      # the risk.
      - dependency-name: redis
        update-types:
          - version-update:semver-major
