name: ci

# Pull-request + main-push gate. Keeps merges green: lint + unit tests for the
# backend, lint + typecheck + build for the frontend. No DB needed — backend
# tests use AsyncMock; integration coverage lives in Playwright (separate).
#
# Both jobs run in parallel; the workflow status is the and of the two so a
# branch needs both before being mergeable.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Lock GITHUB_TOKEN to read-only at the workflow scope. The repo grants
# "Read and write permissions" by default (release.yml needs that for
# GHCR push), but CI only needs to read source. Without this block, a
# compromised third-party action — which CI calls by floating tag for
# ergonomics — would run with a writable token and could mutate the
# repo. Pinning the permissions here removes that blast radius, which
# is what makes floating tags safe here (Codex P1 on PR #101).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest
        # The AI tests rely only on mocked SDKs / mocked DB sessions, so the
        # job stays fully self-contained.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: i18n parity (en/fr keys in sync, no empty values)
        run: npm run i18n:check

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: ESLint (check only — no --fix)
        # The repo's `npm run lint` script ships `--fix`, which is fine
        # locally but mutates files in CI. Call eslint directly.
        run: npx eslint . --ext .vue,.ts,.js

      - name: Production build (runs vue-tsc + vite build)
        run: npm run build

  # Dependency vulnerability scan. Kept in its own job so a transitive
  # advisory shows up as a distinct red check rather than masquerading as a
  # lint/build failure. Runs on every PR and on main pushes alongside the
  # other two jobs.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit (isolated from the audited deps)
        # pipx keeps pip-audit and its own dependency tree out of the
        # environment we audit below.
        run: pipx install pip-audit

      - name: Build an isolated backend runtime environment
        working-directory: backend
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install -e .

      - name: pip-audit (backend runtime deps only)
        working-directory: backend
        # --path audits ONLY the runtime deps installed in the isolated venv,
        # so an advisory in pip-audit's own dependency tree (never shipped in
        # the backend image) can no longer fail this gate. Add
        # `--ignore-vuln <GHSA/PYSEC id>` + justification for findings with no
        # fix available.
        run: |
          pip-audit --desc --path "$(.audit-venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend)
        working-directory: frontend
        # --audit-level=high so only High/Critical advisories fail the gate;
        # lower-severity noise is reported but non-blocking.
        run: |
          npm ci
          npm audit --audit-level=high
