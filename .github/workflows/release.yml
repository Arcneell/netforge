name: release

# Build and publish the production images to GitHub Container Registry.
# Triggers:
#   - push to main           → tagged `latest` + `main-<sha>`
#   - push of a v* git tag   → tagged with the version (e.g. v1.0.0, 1.0)
#
# Images:
#   ghcr.io/<owner>/netforge-backend
#   ghcr.io/<owner>/netforge-frontend
#
# The repo must enable "Read and write permissions" for GITHUB_TOKEN under
# Settings → Actions → General → Workflow permissions. GHCR uses that token
# for authentication; no separate secret is needed.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: backend,  context: ./backend  }
          - { name: frontend, context: ./frontend }
    steps:
      # All third-party actions in this workflow are pinned to full
      # commit SHAs (Dependabot keeps them up to date — see
      # .github/dependabot.yml). The release workflow has
      # `packages: write`, so a "tag move" attack on any unpinned
      # action would let an attacker exfiltrate GITHUB_TOKEN and push a
      # backdoored `latest` image. CI runs (ci.yml) are read-only and
      # are intentionally kept on floating tags for ergonomics.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lowercase the image owner
        # GHCR rejects uppercase characters in the image path; the repo
        # owner is already lowercase here but normalise just in case the
        # workflow is reused on a fork with a capitalised handle.
        id: meta-owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.meta-owner.outputs.value }}/netforge-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            # Publish BOTH v-prefixed and unprefixed semver tags. The
            # deployment docs and .env.example tell operators to set
            # NETFORGE_VERSION=v1.0.0 (matches the git tag they pushed),
            # so the v-prefixed image MUST exist or `docker compose pull`
            # 404s on the first pinned release. The unprefixed pair is
            # kept for compatibility with the broader Docker convention
            # (most registries publish plain semver).
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers across runs to keep the build under ~2 minutes.
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max
          # Supply-chain attestations, attached to the pushed image on GHCR.
          # Both inputs exist since build-push-action v4 (the SHA pinned
          # above is v7.2.0): `provenance` records how/where the image was
          # built (SLSA), `sbom` attaches a Software Bill of Materials so
          # scanners can audit image contents without pulling layers apart.
          provenance: true
          sbom: true
