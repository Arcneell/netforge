# NetForge SPA + API reverse-proxy.
# The CSP and security-header set here mirrors docs/11-security.md.
# In production this container sits behind another TLS-terminating nginx.

server {
    # 8080, not 80: the image is nginxinc/nginx-unprivileged — nginx runs as
    # a non-root user and cannot bind ports <1024. The TLS-terminating proxy
    # in front of this container should target port 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # `unsafe-inline` on style-src is required by Tailwind's JIT. It is NOT
    # allowed on script-src (Vue is bundled, no inline scripts at runtime).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://rsms.me; img-src 'self' data:; font-src 'self' data: https://rsms.me; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Container healthcheck endpoint ----
    # Plain 200, no proxying, so the docker-compose healthcheck (and any
    # external LB probe) gets a cheap liveness signal.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- SSE endpoint — MUST come before /api/ so it wins by specificity.
    # `proxy_buffering off` lets Ask AI deltas flush per token; the default
    # 4 KB buffer pools them into one big response otherwise.
    location = /api/ai/query/stream {
        proxy_pass http://backend:8000/api/ai/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- API reverse proxy ----
    # `backend` is the docker-compose service name. Override by editing this
    # file at build time or mounting a custom conf in prod.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Backend import upload cap is 10 MiB; 12m leaves headroom for the
        # multipart framing overhead (see nginx.prod.conf for the rationale).
        client_max_body_size 12m;
        # 180s ≥ axios' 120s AI timeout (advisor / suggest-links can take 30-90s).
        proxy_read_timeout 180s;
    }

    # ---- Static assets (long-cache hashed bundles) ----
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
