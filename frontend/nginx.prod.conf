# NetForge — production nginx config.
# Baked into the frontend image by frontend/Dockerfile. TLS terminates
# here; the backend speaks plain HTTP over the docker network.
#
# Expectations from the deployment host:
#   - /etc/nginx/certs/fullchain.pem  (mounted RO from ./certs/)
#   - /etc/nginx/certs/privkey.pem    (mounted RO from ./certs/)
#   - DNS for ${SERVER_NAME} resolves to this host.
#
# If you want to terminate TLS at a separate reverse proxy (Caddy /
# Traefik / nginx-proxy-manager / a corporate LB), keep using
# nginx.conf instead — that one listens on port 8080 only.
#
# Ports: the image is nginxinc/nginx-unprivileged — nginx runs as a
# non-root user and therefore cannot bind ports <1024. We listen on
# 8080 (HTTP) and 8443 (TLS); docker-compose.yml maps host 80→8080 and
# 443→8443 so nothing changes for browsers or for ACME http-01.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # ACME http-01 challenges go through unencrypted, everything else
    # gets redirected. If you don't use Let's Encrypt, the location block
    # is a no-op and adds no risk.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # Container healthcheck endpoint — plain HTTP, no redirect, so the
    # docker-compose healthcheck (and any LB probe) can reach it without TLS.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / {
        # $host carries no port, so the redirect targets https://host:443 —
        # which docker-compose.yml maps back onto container port 8443 below.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers — kept in sync with docs/11-security.md.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://rsms.me; img-src 'self' data:; font-src 'self' data: https://rsms.me; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # SSE endpoint — MUST come before the generic /api/ location so this one
    # wins by being more specific. Two things matter for SSE:
    #   - `proxy_buffering off` so each chunk flushes through immediately
    #     instead of waiting for the 4 KB default buffer to fill (which is
    #     what made Ask AI render the answer all-at-once instead of
    #     token-by-token).
    #   - long `proxy_read_timeout` because the stream stays open for
    #     however long the model takes to finish writing.
    location = /api/ai/query/stream {
        proxy_pass http://backend:8000/api/ai/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # API reverse proxy. `backend` is the docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # The backend caps import uploads at 10 MiB. 12m = that cap plus
        # headroom for multipart framing overhead (boundaries, part headers)
        # so a legitimate 10 MiB CSV never gets a 413 from nginx, while
        # anything meaningfully larger is rejected here instead of being
        # streamed to the backend just to be refused there.
        client_max_body_size 12m;
        # 180s ≥ axios' 120s AI timeout — anything longer is a real backend
        # hang and nginx returning 504 is the right signal. AI advisor /
        # suggest-links / draft creation can each take 30-90s.
        proxy_read_timeout 180s;
    }

    # Long-cache hashed bundles (Vite emits content-hashed filenames).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path falls through to index.html so
    # vue-router can handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
