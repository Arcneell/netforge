# NetForge — production nginx config.
# Baked into the frontend image by frontend/Dockerfile. TLS terminates
# here; the backend speaks plain HTTP over the docker network.
#
# Expectations from the deployment host:
#   - /etc/nginx/certs/fullchain.pem  (mounted RO from ./certs/)
#   - /etc/nginx/certs/privkey.pem    (mounted RO from ./certs/)
#   - DNS for ${SERVER_NAME} resolves to this host.
#
# If you want to terminate TLS at a separate reverse proxy (Caddy /
# Traefik / nginx-proxy-manager / a corporate LB), keep using
# nginx.conf instead — that one listens on port 80 only.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 challenges go through unencrypted, everything else
    # gets redirected. If you don't use Let's Encrypt, the location block
    # is a no-op and adds no risk.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers — kept in sync with docs/11-security.md.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://rsms.me; img-src 'self' data:; font-src 'self' data: https://rsms.me; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy. `backend` is the docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # 10 MiB matches the import upload cap on the backend.
        client_max_body_size 16M;
        proxy_read_timeout 60s;
    }

    # Long-cache hashed bundles (Vite emits content-hashed filenames).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path falls through to index.html so
    # vue-router can handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
