# NetForge — production stack.
#
# Two deploy paths, both supported by this file:
#
#   (A) Pull pre-built images from GHCR (default, fastest)
#       git clone https://github.com/Arcneell/netforge.git && cd netforge
#       cp .env.example .env && $EDITOR .env
#       mkdir -p certs && cp /path/to/fullchain.pem certs/ && cp /path/to/privkey.pem certs/
#       docker compose pull
#       docker compose up -d
#       docker compose exec backend alembic upgrade head
#
#   (B) Build from source on the host
#       Same as (A) but: `docker compose up -d --build` (no pull).
#
# Pin a release by exporting NETFORGE_VERSION before bringing the stack up:
#   NETFORGE_VERSION=v1.0.0 docker compose pull && docker compose up -d
#
# Full env-var reference is in .env.example. Required vars:
#   POSTGRES_PASSWORD, PUBLIC_URL, SESSION_SIGNING_KEY, BOOTSTRAP_ADMIN_EMAIL,
#   and the OIDC_* (or GITHUB_*) credentials for whichever AUTH_PROVIDER you pick.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: netforge
      POSTGRES_USER: netforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netforge -d netforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Cache + shared rate-limit counters. The stack works without it — leave
    # REDIS_URL unset in .env and the backend queries Postgres for everything,
    # exactly as it did before this service existed (see backend/app/cache.py).
    # Turning it on is what makes repeated topology / search / dashboard reads
    # and the per-request session lookup cheap.
    image: redis:8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # No `ports:` — reachable only from the compose network. Redis has no
    # authentication by default, so publishing 6379 on the host would hand
    # anyone who can reach it every cached session record. Set REDIS_PASSWORD
    # in .env to add AUTH on top (and put it in REDIS_URL as
    # redis://:<password>@redis:6379/0).
    command: >-
      sh -c 'exec redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      # `appendonly yes` needs somewhere durable to write. Persistence matters
      # beyond warm-cache-after-restart: with RATE_LIMIT_STORE=redis the AI
      # per-user quota lives here, and losing it on restart hands every user a
      # fresh hour of LLM spend — the exact bug the counters moved out of
      # process to fix. See backend/app/services/ai/rate_limit.py.
      - redisdata:/data
    healthcheck:
      # `redis-cli ping` needs the password too once requirepass is set;
      # -a reads it from the env var rather than the command line.
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    # `latest` moves under you on every `docker compose pull` — pin an
    # explicit NETFORGE_VERSION (e.g. v0.1.0) once you're past first setup so
    # a stack restart never silently upgrades production. This default just
    # tracks the version this compose file shipped with.
    image: ghcr.io/arcneell/netforge-backend:${NETFORGE_VERSION:-v0.1.0}
    build:
      context: ./backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Mirrors the image's own HEALTHCHECK (backend/Dockerfile) so that the
      # frontend can wait on `condition: service_healthy` below. curl is
      # installed in the backend image.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql+asyncpg://netforge:${POSTGRES_PASSWORD}@postgres:5432/netforge
      PUBLIC_URL: ${PUBLIC_URL:?missing PUBLIC_URL in .env}
      # ---- Auth ----
      AUTH_PROVIDER: ${AUTH_PROVIDER:-oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid email profile}
      # See .env.example — refuses OIDC logins whose email the IdP did not
      # verify. Only flip to false for a known-good IdP that omits the claim.
      OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # ---- Sessions ----
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?missing SESSION_SIGNING_KEY in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-netforge_session}
      SESSION_COOKIE_SECURE: "true"
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?missing BOOTSTRAP_ADMIN_EMAIL in .env}
      # ---- Redis / caching ----
      # Points at the bundled `redis` service by default, so a stock stack gets
      # the cache. Set REDIS_URL="" in .env to run without it: every consumer
      # falls back to Postgres and the stack behaves as it did before the redis
      # service existed (see backend/app/cache.py). If you set REDIS_PASSWORD,
      # the credential has to appear here too — hence the substitution rather
      # than a flat default.
      REDIS_URL: ${REDIS_URL:-redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379/0}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.5}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-netforge}
      CACHE_SESSIONS_ENABLED: ${CACHE_SESSIONS_ENABLED:-true}
      CACHE_SESSION_TTL_SECONDS: ${CACHE_SESSION_TTL_SECONDS:-30}
      CACHE_READS_ENABLED: ${CACHE_READS_ENABLED:-true}
      CACHE_READ_TTL_SECONDS: ${CACHE_READ_TTL_SECONDS:-300}
      # ---- Rate limiting ----
      RATE_LIMIT_WRITES_PER_WINDOW: ${RATE_LIMIT_WRITES_PER_WINDOW:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      # "database" shares the counters across workers/replicas via the
      # rate_limit_counters table; "redis" does the same with INCR + EXPIRE and
      # requires REDIS_URL; "memory" is the legacy per-process window.
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-database}
      # Only honour X-Real-IP from these CIDRs (see .env.example) — narrow
      # this if the backend sits behind more than the bundled nginx.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      # ---- Outbound webhooks ----
      # SECURITY: leave false. true disables SSRF protection on admin-configured
      # webhook targets — see .env.example.
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      AI_WEBHOOK_SIGNING_SECRET: ${AI_WEBHOOK_SIGNING_SECRET:-}
      # ---- CSV import ----
      CSV_IMPORT_MAX_ROWS: ${CSV_IMPORT_MAX_ROWS:-50000}
      # ---- Audit log retention ----
      # 0 = unlimited retention (default). See .env.example.
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-0}
      # ---- Observability ----
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # ---- CORS ----
      # Empty by default: the frontend image proxies /api/ same-origin
      # (frontend/nginx.prod.conf), so no CORS middleware is installed. Only
      # needed if you serve the SPA from a different origin than the API.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # ---- AI (off by default; see .env.example for the full provider matrix) ----
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_RATE_LIMIT_CALLS: ${AI_RATE_LIMIT_CALLS:-20}
      AI_RATE_WINDOW_SECONDS: ${AI_RATE_WINDOW_SECONDS:-3600}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      # Granular AI toggles. Both default to true and are gated by AI_ENABLED,
      # but they must be passed through explicitly: without these lines a
      # compliance opt-out set in .env would be silently ignored.
      AI_DRAFTS_ENABLED: ${AI_DRAFTS_ENABLED:-true}
      AI_SCHEDULER_ENABLED: ${AI_SCHEDULER_ENABLED:-true}

  frontend:
    # See the backend image note above — pin NETFORGE_VERSION explicitly for
    # any real deployment.
    image: ghcr.io/arcneell/netforge-frontend:${NETFORGE_VERSION:-v0.1.0}
    build:
      context: ./frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Host 80/443 → container 8080/8443. The frontend image is
      # nginxinc/nginx-unprivileged (non-root nginx), which cannot bind
      # ports <1024 inside the container — the mapping restores the
      # standard ports on the host side, so nothing changes for users,
      # DNS or ACME http-01 challenges.
      - "80:8080"
      - "443:8443"
    volumes:
      # TLS material — mount your fullchain + privkey here. The image's
      # nginx config (frontend/nginx.prod.conf) expects exactly these names.
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      # Hits the plain-HTTP /healthz endpoint baked into both nginx configs
      # (no TLS, no redirect) on the container-internal port 8080 — the
      # unprivileged image listens there, not on 80. busybox wget ships in
      # the nginx-unprivileged alpine image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: netforge_pgdata
  redisdata:
    name: netforge_redisdata
